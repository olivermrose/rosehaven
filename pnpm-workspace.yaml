engineStrict: true
allowBuilds:
  "@hugeicons/svelte": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
minimumReleaseAgeExclude:
  - "@rosehaven/*"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
